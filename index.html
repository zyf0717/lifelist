<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBird Lifelist</title>
<script src="js/vendor/chart.min.js" charset="utf-8"></script>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body { background: #14171c; color: #d6d9de; font: 14px/1.5 system-ui, sans-serif; margin: 0; }
  main { max-width: 1150px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .controls .row { display: flex; gap: 12px; align-items: center; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=number], select, button { background: #1e232a; color: #d6d9de; border: 1px solid #3a3f46; border-radius: 4px; padding: 4px; }
  button { padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: #5fb4d9; }
  #chart { width: 100%; height: 560px; }
  #dropzone { position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(20,23,28,.92); border: 3px dashed #5fb4d9; z-index: 10; font-size: 22px; }
  #dropzone.over { display: grid; }
  #hint { border: 2px dashed #3a3f46; border-radius: 8px; padding: 40px; text-align: center; }
  #error { color: #e06c75; min-height: 1.5em; }
  footer { color: #8b93a0; font-size: 12px; margin-top: 12px; }
  a { color: #5fb4d9; }
</style>
</head>
<body>
<main>
  <h1>eBird Lifelist</h1>
  <div class="controls">
    <div class="row">
      <input id="file" type="file" accept=".csv,text/csv">
      <span id="dl-row" style="display:none">Save
        <button data-w="1920" data-name="1080p">Full HD</button>
        <button data-w="2560" data-name="1440p">QHD</button>
        <button data-w="3840" data-name="2160p">4K</button>
      </span>
    </div>
    <label id="year-wrap" style="display:none">Start year <select id="start-year"></select></label>
    <label id="home-wrap" style="display:none">Default <select id="home-country"></select></label>
  </div>
  <div id="error"></div>
  <div id="hint">Drag your <code>MyEBirdData.csv</code> here (My eBird → Download my data). Nothing leaves your browser.</div>
  <div id="chart"></div>
  <footer>Data is parsed locally in this browser. Add <code>?demo</code> to the URL for sample data. Source: <a href="https://github.com/zyf0717/lifelist">github.com/zyf0717/lifelist</a></footer>
</main>
<div id="dropzone">Drop the CSV anywhere</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
